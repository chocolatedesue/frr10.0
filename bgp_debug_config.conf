!
! FRR BGP 完整调试配置文件
! 用于启用所有 BGP 调试消息
!
! 文件: /etc/frr/frr.conf 或单独的配置文件
! 创建时间: 2025-06-27
!

!
! ============== 日志配置 ==============
!
! 配置多种日志输出方式
log file /var/log/frr/bgpd.log debugging
log syslog debugging
! 如果需要在终端查看实时日志，取消下面注释
! log stdout debugging

!
! ============== BGP 基础调试 ==============
!
! BGP AS4 相关调试
debug bgp as4
debug bgp as4 segment

! BGP 邻居事件调试（连接、断开、状态变化等）
debug bgp neighbor-events

! BGP 下一跳跟踪调试
debug bgp nht

! BGP Keepalive 消息调试
debug bgp keepalives

! BGP 更新消息调试（包含详细信息）
debug bgp updates
debug bgp updates detail

! BGP 最佳路径选择调试
debug bgp bestpath

! BGP 与 Zebra 通信调试
debug bgp zebra

! BGP 更新组调试
debug bgp update-groups

!
! ============== BGP 高级调试功能 ==============
!
! BGP VPN 调试
debug bgp vpn

! BGP 标签池调试
debug bgp labelpool

! BGP 优雅重启调试
debug bgp graceful-restart

! BGP BFD 调试
debug bgp bfd

! BGP 条件通告调试
debug bgp conditional-advertisement

! BGP PBR (Policy Based Routing) 调试
debug bgp pbr

! BGP EVPN Multi-Homing 调试
debug bgp evpn mh es
debug bgp evpn mh route

! BGP 流规范调试
debug bgp flowspec

!
! ============== BGP 消息转储配置 ==============
!
! 转储所有 BGP 数据包和事件到文件
dump bgp all /var/log/frr/bgp-all.dump 300

! 转储 BGP 更新消息到文件（每5分钟创建新文件）
dump bgp updates /var/log/frr/bgp-updates.dump 300

! 转储 BGP 路由表（MRT 格式）
dump bgp routes-mrt /var/log/frr/bgp-routes.mrt 3600

!
! ============== BGP 基础配置示例 ==============
!
! 以下是一个基本的 BGP 配置示例
! 请根据实际环境修改 AS 号码、Router ID 和邻居配置
!
router bgp 65001
 bgp router-id 10.0.0.1
 bgp log-neighbor-changes
 
 ! 配置邻居（请根据实际情况修改）
 ! neighbor 192.168.1.2 remote-as 65002
 ! neighbor 192.168.1.2 description "External Peer"
 ! neighbor 192.168.1.2 timers 30 90
 
 ! 地址族配置
 address-family ipv4 unicast
  ! 在这里添加具体的地址族配置
 exit-address-family
 
 address-family ipv6 unicast
  ! 在这里添加 IPv6 地址族配置
 exit-address-family

!
! ============== 其他有用的调试配置 ==============
!
! 允许火星下一跳（用于调试）
! bgp allow-martian-nexthop

! 服务器反射器配置（如果需要）
! bgp cluster-id 10.0.0.1

!
! ============== 配置文件说明 ==============
!
! 使用方法:
! 1. 将此配置复制到 /etc/frr/frr.conf
! 2. 或者使用 vtysh 逐行输入配置
! 3. 运行 "systemctl restart frr" 重启服务
! 4. 使用 "show debug" 命令查看启用的调试功能
!
! 查看日志的命令:
! - tail -f /var/log/frr/bgpd.log
! - journalctl -u frr -f
! - vtysh -c "show debug"
!
! 关闭特定调试的方法:
! - 在命令前加 "no"，例如: no debug bgp updates
!
! 注意事项:
! 1. 启用所有调试会产生大量日志，确保有足够的磁盘空间
! 2. 在生产环境中谨慎使用，可能影响性能
! 3. 建议先在测试环境中验证配置
! 4. 定期清理日志文件避免磁盘空间不足
!
end
